# server{} half of Multitec's nginx additions. Installed by docs/multitec/runtime/boot.sh,
# which fills in the feeds directory.

# While Next.js is not listening yet, nginx itself produces the 502 (connection refused),
# and so this catches the boot and nothing that Next.js says: without
# `proxy_intercept_errors`, a 5xx that Next.js sends passes through untouched. A 504 is
# the same situation seen later, a Next.js that stopped answering.
#
# Always a 503, for two reasons. A browser renders the body of a 503 just the same, and
# no cache or client mistakes it for the real page. Every non-browser caller, Stripe
# included, reads a 503 as "retry" and not as "delivered".
error_page 502 504 =503 @multitec_booting;

location @multitec_booting {
    add_header Retry-After 2 always;
    add_header Cache-Control "no-store" always;
    if ($multitec_navigation = 0) {
        return 503;
    }
    default_type text/html;
    charset utf-8;
    root /usr/share/multitec;
    rewrite ^ /loading.html break;
}

# The boot screen's long-poll: answered by ready-waiter.mjs only once Homarr's own health
# check passes, so the request stays open (and the instance keeps its CPU) for the whole
# boot. If the waiter is not there, this is a 502 and so a plain 503 from the block above,
# and the screen falls back to polling.
location = /__multitec/ready {
    proxy_pass http://127.0.0.1:3002/ready;
    proxy_read_timeout 75s;
    add_header Cache-Control "no-store" always;
}

# The app icons. They used to be `data:` URIs inside each app's `iconUrl`: 94 % of the
# members' page, 1.25 MB on every visit, warm or cold, and uncacheable by construction.
# Now they are files beside the feed bundles, named after their own content hash
# (`<sha256[:16]>.webp`, written by quantumpc's `bin/qpc-portal-icons`), so a name can
# never point at different bytes, and a browser keeps each one for a year and never asks
# again.
#
# `private` because the page is behind IAP: the member's browser may keep it, a shared
# cache may not. No `always`: a 404 must not be cached for a year.
location /multitec-static/icons/ {
    alias @MULTITEC_FEED_DIR@/icons/;
    default_type image/webp;
    add_header Cache-Control "private, max-age=31536000, immutable";
}
