# http{} half of Multitec's nginx additions. Installed by docs/multitec/runtime/boot.sh.
#
# WHO GETS THE BOOT SCREEN. Only a person opening a page. Anything else that receives an
# HTML page takes it as the answer: a tRPC call would try to parse it, and a machine
# client would record a success. So the screen goes to a top-level navigation and
# nothing else.
#
# `Sec-Fetch-Mode: navigate` is what every current browser sends for exactly that. The
# `Accept: text/html` fallback covers a browser old enough not to send Sec-Fetch headers
# at all, and only when the header is absent, so a `fetch()` that asks for HTML does not
# qualify.
map $http_sec_fetch_mode $multitec_fetch_mode {
    navigate navigate;
    ""       absent;
    default  other;
}

map "$request_method:$multitec_fetch_mode:$http_accept" $multitec_navigation {
    default                     0;
    "~^GET:navigate:"           1;
    "~^GET:absent:.*text/html"  1;
}
