<!doctype html>
<!-- impeccable-disable overused-font: it follows the portal it stands in for, which is Homarr and sets Inter; a different face for four seconds would read as a different site -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark light">
<title>Portal de socios · Multitec</title>
<!-- multitec-boot-screen: the marker docs/multitec/runtime/test-boot-screen.sh looks for -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e03131'/%3E%3Cpath d='M8 23V9l8 8 8-8v14' fill='none' stroke='%23fff' stroke-width='3.4' stroke-linejoin='round'/%3E%3C/svg%3E">
<noscript><meta http-equiv="refresh" content="3"></noscript>
<style>
  :root {
    --bg: #1a1b1e; --panel: #25262b; --ink: #e9e9ec; --muted: #a6a7ad; --accent: #e03131; --track: #373a40;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f4f4f6; --panel: #ffffff; --ink: #1d1e22; --muted: #5c5f66; --track: #dee2e6; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 Inter, "Segoe UI", sans-serif;
  }
  main { width: min(420px, 100%); text-align: center; }
  .mark { width: 64px; height: 64px; margin: 0 auto 24px; position: relative; }
  .mark svg { width: 64px; height: 64px; display: block; }
  .ring {
    position: absolute; inset: -10px; border-radius: 50%;
    border: 3px solid var(--track); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  h1 { font-size: 24px; line-height: 1.25; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
  button {
    margin-top: 24px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 8px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600; cursor: pointer;
  }
  [hidden] { display: none !important; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .ring { animation-duration: 4s; } }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <div class="ring"></div>
    <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#e03131"/><path d="M8 23V9l8 8 8-8v14" fill="none" stroke="#fff" stroke-width="3.4" stroke-linejoin="round"/></svg>
  </div>
  <h1 id="title">Arrancando el portal de socios</h1>
  <p id="line" role="status" aria-live="polite">Estaba en reposo para no gastar. Tarda unos segundos, no cierres la página.</p>
  <button id="retry" type="button" hidden>Reintentar</button>
</main>
<script>
(function () {
  // Spanish first, English for a browser that asks for it (agent repo CLAUDE.md: pages the
  // members read are Spanish first).
  var en = /^en\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "");
  var copy = en ? {
    title: "Starting the members' portal",
    wait: "It was asleep to save money. It takes a few seconds, keep this page open.",
    slow: "Taking longer than usual. Still trying.",
    down: "The portal is not answering. Try again in a few minutes.",
    retry: "Try again"
  } : {
    title: "Arrancando el portal de socios",
    wait: "Estaba en reposo para no gastar. Tarda unos segundos, no cierres la página.",
    slow: "Está tardando más de lo normal. Sigue intentándolo.",
    down: "El portal no responde. Vuelve a intentarlo en unos minutos.",
    retry: "Reintentar"
  };
  var $ = function (id) { return document.getElementById(id); };
  document.documentElement.lang = en ? "en" : "es";
  $("title").textContent = copy.title;
  $("line").textContent = copy.wait;
  $("retry").textContent = copy.retry;
  $("retry").onclick = function () { location.reload(); };

  var began = Date.now();
  function giveUp() {
    $("line").textContent = copy.down;
    document.querySelector(".ring").hidden = true;
    $("retry").hidden = false;
  }
  function wait() {
    var elapsed = Date.now() - began;
    if (elapsed > 180000) return giveUp();
    if (elapsed > 25000) $("line").textContent = copy.slow;
    // A long-poll: the server holds this open until the portal is healthy, which is also
    // what keeps the instance's CPU allocated while it boots.
    fetch("/__multitec/ready", { cache: "no-store", credentials: "same-origin" })
      .then(function (r) {
        if (r.ok) return location.reload();
        setTimeout(wait, 1000);
      })
      .catch(function () { setTimeout(wait, 2000); });
  }
  wait();
})();
</script>
</body>
</html>
