# Build the portal image in Cloud Build, with BuildKit.
#
# Why this file exists rather than `gcloud builds submit --tag`: that shortcut uses Cloud
# Build's **legacy** builder, which has no BuildKit, and Homarr's Dockerfile opens with
# `# syntax=docker/dockerfile:1.25` and uses `COPY --parents`. The legacy builder ignores
# the syntax directive and then cannot parse the file:
#
#   Error response from daemon: dockerfile parse error line 15: Unknown flag: parents
#
# It lives under docs/multitec/ rather than at the repository root because a root
# `cloudbuild.yaml` would be a file inside upstream's tree, and this is ours.
#
# RUNS ON ITS OWN since 2026-08-31: a Cloud Build trigger (`mt-portal`, in
# multitec-terrafrom's settings/multitecweb.yaml, `app.service.portal.cloudbuild`) fires
# this file on every push to the `multitec` branch — `_IMAGE` comes from the trigger's own
# substitutions, tagged `$SHORT_SHA`, and the last step deploys it. Before the trigger
# existed this was three manual `gcloud builds submit` + `gcloud run deploy` round trips
# in one session, each read off this file's own comment. Nobody should need to run this
# by hand again; if you find yourself about to, that usually means the push didn't land on
# `multitec`, not that the trigger is missing:
#
#   gcloud builds submit --config docs/multitec/tools/cloudbuild.yaml \
#     --substitutions _IMAGE=<tag> --project multitecweb --region europe-west1
#
# It is also here, and not only in a shell history, because the next person to rebuild this
# image will otherwise rediscover the parse error from scratch.

steps:
  # --- Decide what actually has to be built. ---
  #
  # Sergio, 2026-09-25, after an afternoon of 13-minute builds for changes that only touched
  # our own files: use the cached base image and build only what is new. Measured on build
  # e86bb3da: tests 89 s, the Homarr image (buildx) 622 s, compile-cache warm-up 24 s,
  # migrations 3 s, candidate roll-out 49 s. Everything in docs/multitec/runtime/ goes into
  # a thin layer ON TOP of the Homarr image, so a change there never needed those 622 s.
  #
  # THE KEY. The Homarr image is a function of every file in the repository except our
  # docs/multitec/ tree, whose runtime part the thin layer adds on its own and whose tools
  # (this file included) are not in the image at all. So the key is a hash of the git tree
  # with docs/multitec/ left out, plus a recipe version for the build arguments below. An
  # image tagged `base-<key>` in the registry IS that tree, built; if it is there, this
  # build reuses it and skips the tests too (they test that very code, unchanged). The
  # compile-cache image `warm-<key>` depends only on the base, so it is reused the same way.
  #
  # FAILS TOWARDS BUILDING. No git in the checkout (a manual `gcloud builds submit` does not
  # upload .git), or a registry that cannot be asked, means an empty key and a full build.
  # A cleanup policy that deleted an old base only costs one full build.
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # THE IMAGE TAG, and why it is resolved in a script: see the note on the build step.
        image_tag="$_IMAGE"
        if [ -z "$image_tag" ]; then
          image_tag="${_IMAGE_BASE}:${SHORT_SHA}"
        fi
        echo "$image_tag" > /workspace/.image
        repo="$${image_tag%:*}"

        recipe="base-recipe-1"
        key=""
        if git rev-parse -q --verify HEAD >/dev/null 2>&1; then
          key="$( { echo "$recipe"; git ls-tree -r HEAD | awk -F'\t' 'index($$2, "docs/multitec/") != 1'; } \
            | sha256sum | cut -c1-16)"
        fi
        if [ -z "$key" ]; then
          echo "no git tree in this checkout: building everything"
          key="nogit-$(date +%s)"
        fi
        echo "$repo:base-$key" > /workspace/.base
        echo "$repo:warm-$key" > /workspace/.warm

        exists() { gcloud artifacts docker images describe "$$1" --quiet >/dev/null 2>&1; }
        if exists "$(cat /workspace/.base)"; then
          echo yes > /workspace/.base_reused
          echo "REUSING the Homarr image $(cat /workspace/.base): nothing outside docs/multitec/ changed"
        else
          echo no > /workspace/.base_reused
          echo "BUILDING the Homarr image $(cat /workspace/.base): code outside docs/multitec/ changed"
        fi
        if exists "$(cat /workspace/.warm)"; then
          echo yes > /workspace/.warm_reused
          echo "REUSING the compile-cache image $(cat /workspace/.warm)"
        else
          echo no > /workspace/.warm_reused
        fi

  # --- Our tests, before the image, so a failure costs one minute and not fifteen. ---
  #
  # Only what this fork owns. Running Homarr's whole suite here would be testing upstream's
  # code on every build of ours, and upstream already does that.
  #
  # It is also not merely wasteful — it does not work. `--ignore-scripts` means
  # better-sqlite3 never compiles its native binding, so nine of upstream's auth suites
  # fail to LOAD (0 tests each) while every test that runs passes. Dropping the flag would
  # mean installing a C toolchain into this step to build a driver our tests never touch.
  # Measured 2026-08-29: this scope is 9 files, 159 tests, green.
  #
  # ALPINE and not -slim, which is not cosmetic: `pnpm-lock.yaml` resolves the rolldown
  # native binding to `@rolldown/binding-linux-x64-musl`. On a glibc image vitest dies with
  # "Cannot find native binding" before running a single test — which reads like a broken
  # install rather than the wrong libc.
  #
  # And 24, not 22: the root package.json sets `engines.node >= 24.18.0`, which pnpm
  # enforces on install. Node 22 runs the tests perfectly well when node_modules already
  # exists, so this only bites in CI, where the install is the first thing that happens:
  #
  #   [ERR_PNPM_UNSUPPORTED_ENGINE] Expected version: >=24.18.0 / Got: v22.23.2
  - name: node:24-alpine
    entrypoint: sh
    args:
      - -c
      - |
        set -eu
        # Same tree as an image already built and tested: nothing these tests cover changed.
        if [ "$(cat /workspace/.base_reused)" = yes ]; then
          echo "tests: SKIPPED, the code they cover is the code of $(cat /workspace/.base)"
          exit 0
        fi
        corepack enable
        pnpm install --frozen-lockfile --ignore-scripts
        # The fork-hygiene linter, before anything expensive. It needs the upstream ref,
        # which a Cloud Build checkout does not have — so it is skipped rather than failed
        # when there is none, and enforced on quantumpc where the remote exists. A guard
        # that cannot run must never look like a guard that passed, hence the message.
        if git rev-parse --verify --quiet upstream/dev >/dev/null 2>&1; then
          bash docs/multitec/tools/upstream-guard.sh
        else
          echo "upstream-guard: SKIPPED — no upstream/dev in this checkout (run it locally)"
        fi
        # --frozen-lockfile because MULTITEC.md forbids moving pnpm-lock.yaml except for a
        # real dependency change, and a build must never be the thing that moves it.
        node node_modules/vitest/vitest.mjs run \
          packages/auth/providers/test/iap-assertion.spec.ts \
          packages/auth/providers/test/filter-providers.spec.ts \
          packages/api/src/multitec/identity.spec.ts \
          apps/nextjs/src/app/api/multitec/_lib/feed-names.spec.ts \
          packages/definitions
    env:
      - CI=true
      - NODE_ENV=development

  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    env:
      - DOCKER_BUILDKIT=1
    args:
      - -c
      - |
        set -euo pipefail
        base="$(cat /workspace/.base)"
        if [ "$(cat /workspace/.base_reused)" = yes ]; then
          echo "buildx: SKIPPED, $base already exists"
          exit 0
        fi

        # `DOCKER_BUILDKIT=1` alone was not enough, and the second error is more
        # interesting than the first:
        #
        #   requested experimental feature exec.secretenv is not supported by build
        #   server, please update docker
        #
        # BuildKit was running by then, but it was the daemon's own — and Cloud Build's
        # daemon is too old for the `--mount=type=secret,env=…` form that upstream's
        # Dockerfile uses for its Turbo remote-cache credentials. There is no flag for
        # that; the build server itself is the thing that is old.
        #
        # The docker-container driver sidesteps it entirely by running a current BuildKit
        # in a container, independent of whatever daemon is underneath. That is also why
        # this does NOT patch the Dockerfile to drop those mounts: touching an upstream
        # file to work around our builder would conflict on every upstream Dockerfile
        # change, forever, for a build-host problem.
        docker buildx create --use --name mt-builder --driver docker-container
        docker buildx inspect --bootstrap

        # SKIP_ENV_VALIDATION because the build has no database, no Redis and no IAP
        # audience — the app validates its environment at boot, and a build box has none
        # of it. CI=true is what upstream's own Dockerfile passes.
        #
        # THE IMAGE TAG (resolved in the first step now), and why it is not one `-t "$_IMAGE"`:
        # Cloud Build substitutes `$_XXX` tokens in ONE pass over this file's own text.
        # `$_IMAGE` is required by every manual `gcloud builds submit` call this file has
        # ever seen. The trigger (multitec-terrafrom, `app.service.portal.cloudbuild`)
        # cannot know a commit's SHA at `terraform apply` time, so it cannot supply that
        # same substitution — it supplies `_IMAGE_BASE` instead, and `$SHORT_SHA` (a
        # built-in, populated only on a real repo-triggered build) is resolved by Cloud
        # Build directly in THIS file, not smuggled inside another substitution's value —
        # a first version set `_IMAGE` itself to `"...:$SHORT_SHA"` at the Terraform end,
        # and that `$SHORT_SHA` never got a second look.
        # Both are read into a shell variable before use because Cloud Build replaces an
        # unset custom substitution with an empty string rather than erroring (ALLOW_LOOSE
        # is forced on every triggered build), and this script's own `set -euo pipefail`
        # turns a literal, unquoted `$SHORT_SHA` into "unbound variable" the moment it is
        # not a real substitution — measured, not guessed, in a failed run of exactly this
        # trigger.
        #
        # lowercase on purpose: Cloud Build's substitution scanner reads every dollar
        # sign followed by an all-caps word ANYWHERE in this file — including inside a
        # step's own script, comments and all — as an attempted substitution. Naming
        # this variable in all caps (the natural bash convention) failed config
        # validation outright, before a single step ran: "key in the template is not a
        # valid built-in substitution". Lowercase is invisible to that scanner.
        #
        # --push rather than build-then-push: with the container driver the image lives in
        # the builder, not in the daemon's image store, so a later `docker push` would not
        # find it.
        docker buildx build --push \
          --build-arg SKIP_ENV_VALIDATION=true \
          --build-arg CI=true \
          -t "$base" .

  # --- Warm Node's compile cache into the image. ---
  #
  # Node 22+ can keep V8's compiled code on disk (`NODE_COMPILE_CACHE`) and reuse it on the
  # next start, but on Cloud Run every cold start IS the first start: the filesystem is
  # memory and dies with the instance. So the cache is made here, once per image, by
  # booting it with its own defaults (a throwaway SQLite database inside the container,
  # nothing of ours), loading the health check and two pages, and stopping it GRACEFULLY:
  # Node writes the cache at exit, and a `docker rm -f` measured 976 KB of cache against
  # 6.7 MB after a clean stop.
  #
  # Measured on quantumpc with one CPU (agent repo, docs/research/portal-cold-start.md):
  # a fresh container with this cache went from 3.5 s to 2.5 s to healthy, against a
  # Postgres database, although the cache was made against SQLite. The files it covers
  # are the same; only the driver differs.
  #
  # Built once per base (`warm-<key>`, see the first step) and reused after that.
  #
  # The image that ships is a thin layer on top of the one buildx pushed (`base-<key>`), so the
  # upstream Dockerfile does not grow a boot-the-app step of its own. The same layer adds
  # docs/multitec/runtime at /app/multitec (the boot screen, inert until the deployment
  # runs its boot.sh), which is how the boot screen ships without editing upstream's
  # Dockerfile: the modified-file budget was full.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        image="$(cat /workspace/.image)"
        base="$(cat /workspace/.base)"
        warm="$(cat /workspace/.warm)"
        mkdir -p /workspace/warm
        cp -r docs/multitec/runtime /workspace/warm/runtime

        if [ "$(cat /workspace/.warm_reused)" != yes ]; then
        docker pull -q "$base"
        key="$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')"
        docker run -d --name warm -e SECRET_ENCRYPTION_KEY="$key" \
          -e NODE_COMPILE_CACHE=/app/.multitec-compile-cache "$base"
        for attempt in $(seq 1 180); do
          if docker exec warm wget -q -O /dev/null http://127.0.0.1:7575/api/health/live; then break; fi
          sleep 1
        done
        docker exec warm wget -q -O /dev/null http://127.0.0.1:7575/api/health/live
        docker exec warm wget -q -O /dev/null http://127.0.0.1:7575/ || true
        docker exec warm wget -q -O /dev/null http://127.0.0.1:7575/auth/login || true
        docker stop -t 30 warm
        docker cp warm:/app/.multitec-compile-cache /workspace/warm/compile-cache
        docker rm warm
        size_mb="$(du -sm /workspace/warm/compile-cache | cut -f1)"
        echo "compile cache: $size_mb MB"
        if [ "$size_mb" -lt 2 ]; then
          echo "compile cache is too small to be the real one, refusing to ship it"
          exit 1
        fi
        printf 'FROM %s\nCOPY compile-cache /app/.multitec-compile-cache\nENV NODE_COMPILE_CACHE=/app/.multitec-compile-cache\n' \
          "$base" > /workspace/warm/Dockerfile.warm
        docker build -q -f /workspace/warm/Dockerfile.warm -t "$warm" /workspace/warm
        docker push -q "$warm"
        else
        echo "compile cache: REUSING $warm"
        docker pull -q "$warm"
        fi

        # The only layer a docs/multitec/runtime change rebuilds.
        printf 'FROM %s\nCOPY runtime /app/multitec\n' "$warm" > /workspace/warm/Dockerfile
        docker build -q -t "$image" /workspace/warm
        docker push -q "$image"

  # --- Migrate the members' database, here and not at every boot. ---
  #
  # Upstream's run.sh migrates and re-checks every seed row, one query at a time, at every
  # start, against a Neon database it has usually just woken. Measured: 3.3 s of every
  # 13-second cold start. The deployment sets DB_MIGRATIONS_DISABLED=true (upstream's own
  # switch), so the schema has to move forward somewhere else, and this is the one place
  # every new image passes through. Before the new revision exists, exactly like the boot
  # did, so the old revision serves against the new schema for the same few seconds it
  # always has.
  #
  # DB_URL comes straight out of Secret Manager into the environment and on into the
  # container by NAME (`-e DB_URL`), so the value never appears in a command line or a log.
  - name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: ["DB_URL"]
    args:
      - -c
      - |
        set -euo pipefail
        image="$(cat /workspace/.image)"
        docker run --rm -w /app --entrypoint node \
          -e DB_URL -e DB_DRIVER=node-postgres -e DB_DIALECT=postgresql -e DISABLE_REDIS_LOGS=true \
          "$image" ./db/migrations/postgresql/migrate.cjs ./db/migrations/postgresql

  # --- Roll it out, but only once it has proved it boots. ---
  #
  # `template[0].containers[0].image` is unconditionally in this project's shared Cloud
  # Run module's `ignore_changes` — Terraform deliberately never touches it, so nothing
  # updates the running revision unless something calls `gcloud run deploy` itself. The
  # trigger's own service account carries `roles/run.admin` (`gcp.cloudbuild.tf`).
  #
  # WHY THE CANDIDATE STEP EXISTS. The startup probe used to be an HTTP check on Homarr's
  # own health endpoint, which also meant a revision whose Homarr never came up (a bad key,
  # a broken migration) never received traffic. For the boot screen it is a TCP check on
  # nginx, which passes within a second, so that protection moves here: deploy with no
  # traffic under the `candidate` tag, ask the candidate's own URL through IAP until
  # `/api/health/live` says 200, and only then move traffic and drop the tag. A candidate
  # that never becomes healthy fails the build and members never see it.
  #
  # Through IAP with a JWT this build's own account signs for itself (`aud = <url>/*`, the
  # only form IAP on Cloud Run accepted from a machine: agent repo, memory
  # `iap-y-despliegue`). The account is an IAP member of this one service and may sign for
  # itself only, both in multitec-terrafrom.
  #
  # `/__multitec/ready` first, because it is a long-poll: it keeps a request open, which is
  # what gives a no-traffic candidate CPU to boot under request-based billing.
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        image="$(cat /workspace/.image)"
        gcloud run deploy mt-portal --image="$image" --no-traffic --tag=candidate \
          --project=multitecweb --region=europe-west1 --quiet

        base_url="$(gcloud run services describe mt-portal --project=multitecweb \
          --region=europe-west1 --format='value(status.url)')"
        candidate="https://candidate---$${base_url#https://}"
        account="$(gcloud auth list --filter=status:ACTIVE --format='value(account)' | head -n1)"
        now="$(date +%s)"
        printf '{"iss":"%s","sub":"%s","email":"%s","aud":"%s/*","iat":%s,"exp":%s}' \
          "$account" "$account" "$account" "$candidate" "$now" "$((now + 1800))" > /workspace/claims.json
        gcloud iam service-accounts sign-jwt /workspace/claims.json /workspace/iap.jwt \
          --iam-account="$account" --quiet
        jwt="$(cat /workspace/iap.jwt)"
        rm -f /workspace/iap.jwt

        healthy=""
        deadline=$(( $(date +%s) + 300 ))
        while [ "$(date +%s)" -lt "$deadline" ]; do
          code="$(curl -s -o /workspace/health.json -w '%{http_code}' -m 20 \
            -H "Authorization: Bearer $jwt" "$candidate/api/health/live" || true)"
          if [ "$code" = "200" ]; then healthy=yes; break; fi
          echo "candidate not healthy yet (HTTP $code), holding the boot long-poll open"
          curl -s -o /dev/null -m 80 -H "Authorization: Bearer $jwt" "$candidate/__multitec/ready" || true
          sleep 2
        done
        if [ -z "$healthy" ]; then
          echo "the candidate never became healthy; traffic stays where it is"
          cat /workspace/health.json || true
          exit 1
        fi
        echo "candidate healthy: $(cat /workspace/health.json | head -c 300)"

        gcloud run services update-traffic mt-portal --to-latest \
          --project=multitecweb --region=europe-west1 --quiet
        gcloud run services update-traffic mt-portal --remove-tags=candidate \
          --project=multitecweb --region=europe-west1 --quiet

availableSecrets:
  secretManager:
    - versionName: projects/multitecweb/secrets/mt-portal-db-url/versions/latest
      env: DB_URL

# The build is a pnpm install plus a Next.js monorepo build. It was tried on quantumpc
# first and pushed that machine to 1.6 GB free with 5.6 GB of swap in use, next to a live
# Minecraft server — which is why it runs here instead.
#
# E2_HIGHCPU_32 and not _8, and the reason is in the log of the build that died:
#
#   ✓ Compiled successfully in 82s
#   Collecting page data using 7 workers ...
#   <nothing — INTERNAL_ERROR>
#
# Compilation is not the expensive part; the page-data pass is, because Next.js forks one
# worker per CPU and each loads the application. On _8 that is 7 workers sharing 8 GB and
# the worker VM dies with no message at all — INTERNAL_ERROR, which reads like a Cloud
# Build fault rather than "you ran out of memory".
#
# The fix is FEWER CPUs, not more, and the second failure is what taught me that.
#
# _32 was the obvious reaction and it is quota-restricted in europe-west1 for this project
# — which turned out to be a favour. Next.js forks one page-data worker per CPU, and every
# E2_HIGHCPU size gives 1 GB per vCPU, so a bigger machine buys more workers competing for
# proportionally the same memory. It would very likely have died the same way, slower.
#
# The default worker is 2 vCPU with 8 GB. Same total memory as _8, but ONE page-data worker
# instead of seven. Compilation goes from 82 seconds to a few minutes, which costs nothing
# for something built a handful of times a month.
#
# So: no machineType at all. If this ever needs to go faster, the lever is capping the
# worker count in next.config.ts — upstream's file, and a registered touchpoint we have not
# needed to spend.
options:
  logging: CLOUD_LOGGING_ONLY

timeout: 2700s
